<div
      class="reserve-modal"
      id="reserve-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="reserve-modal-title"
      hidden
    >
      <div class="reserve-modal__backdrop" data-reserve-close tabindex="-1"></div>
      <div class="reserve-modal__dialog" role="document">
        <button
          type="button"
          class="reserve-modal__close"
          data-reserve-close
          aria-label="Close reservation form"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>

        <div class="reserve-modal__grid">
          <div class="reserve-modal__intro">
            <p class="reserve-modal__eyebrow">
              Book Your Experience
              <span aria-hidden="true"></span>
            </p>
            <h2 id="reserve-modal-title" class="reserve-modal__title">
              Reserve <span>Your Table</span>
            </h2>
            <div class="reserve-modal__divider" aria-hidden="true">
              <span></span>
              <em>♦</em>
              <span></span>
            </div>
            <p class="reserve-modal__copy">
              Whether it's a casual hangout, match night or a late-night chill session — we've got the
              perfect table waiting for you.
            </p>
          </div>

          <form class="reserve-modal__form" id="reserve-form" novalidate>
            <div class="reserve-modal__fields">
              <label class="reserve-field">
                <span class="sr-only">Full Name</span>
                <span class="reserve-field__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <circle cx="12" cy="8" r="3.2" />
                    <path d="M5.5 19.2c1.6-3.2 4-4.8 6.5-4.8s4.9 1.6 6.5 4.8" />
                  </svg>
                </span>
                <input
                  type="text"
                  name="name"
                  autocomplete="name"
                  placeholder="Full Name"
                  required
                  maxlength="80"
                />
              </label>

              <label class="reserve-field">
                <span class="sr-only">Phone Number</span>
                <span class="reserve-field__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path
                      d="M8.2 4.8l2.1 2.1a1.2 1.2 0 0 1 0 1.7l-1 1c1.2 2.2 2.9 3.9 5.1 5.1l1-1a1.2 1.2 0 0 1 1.7 0l2.1 2.1a1.2 1.2 0 0 1 0 1.7l-1.3 1.3c-.7.7-1.7 1-2.7.8-3.3-.7-6.4-2.9-8.8-5.3S3.8 9.1 3.1 5.8c-.2-1 .1-2 .8-2.7L5.2 1.8a1.2 1.2 0 0 1 1.7 0l1.3 1.3z"
                    />
                  </svg>
                </span>
                <input
                  type="tel"
                  name="phone"
                  autocomplete="tel"
                  inputmode="tel"
                  placeholder="Phone Number"
                  required
                  pattern="[+0-9\s\-()]{7,20}"
                />
              </label>

              <label class="reserve-field reserve-field--date">
                <span class="sr-only">Date</span>
                <span class="reserve-field__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <rect x="3.5" y="5" width="17" height="15.5" rx="2" />
                    <path d="M8 3.5v3M16 3.5v3M3.5 10h17" />
                  </svg>
                </span>
                <input type="date" name="date" required />
                <span class="reserve-field__trail" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <rect x="3.5" y="5" width="17" height="15.5" rx="2" />
                    <path d="M8 3.5v3M16 3.5v3M3.5 10h17" />
                  </svg>
                </span>
              </label>

              <label class="reserve-field reserve-field--time">
                <span class="sr-only">Time</span>
                <span class="reserve-field__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <circle cx="12" cy="12" r="8.5" />
                    <path d="M12 7.5V12l3 2" />
                  </svg>
                </span>
                <input type="time" name="time" required />
                <span class="reserve-field__trail" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <circle cx="12" cy="12" r="8.5" />
                    <path d="M12 7.5V12l3 2" />
                  </svg>
                </span>
              </label>

              <label class="reserve-field reserve-field--guests">
                <span class="sr-only">Number of Guests</span>
                <span class="reserve-field__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <circle cx="9" cy="8" r="2.6" />
                    <circle cx="16" cy="9" r="2.2" />
                    <path d="M3.8 18.5c.9-2.6 2.8-4 5.2-4s4.3 1.4 5.2 4" />
                    <path d="M13.2 18.5c.5-1.6 1.5-2.6 2.9-2.8 1.6-.2 3 .8 3.7 2.8" />
                  </svg>
                </span>
                <select name="guests" required>
                  <option value="" disabled selected>Number of Guests</option>
                  <option value="1">1 Guest</option>
                  <option value="2">2 Guests</option>
                  <option value="3">3 Guests</option>
                  <option value="4">4 Guests</option>
                  <option value="5">5 Guests</option>
                  <option value="6">6 Guests</option>
                  <option value="7">7 Guests</option>
                  <option value="8">8+ Guests</option>
                </select>
              </label>

              <label class="reserve-field reserve-field--notes">
                <span class="sr-only">Special Request (Optional)</span>
                <span class="reserve-field__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                      d="M12 3.2l1.9 4.7 5.1.4-3.9 3.2 1.2 4.9L12 13.9 7.7 16.4l1.2-4.9L5 8.3l5.1-.4L12 3.2z"
                    />
                  </svg>
                </span>
                <textarea
                  name="notes"
                  rows="3"
                  maxlength="300"
                  placeholder="Special Request (Optional)"
                ></textarea>
              </label>
            </div>

            <button type="submit" class="reserve-modal__submit">Reserve Now</button>
            <p class="reserve-modal__note" id="reserve-note" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
